name: Bug report
description: Report a bug or unexpected behaviour in Swaype
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear, concise description of the bug.
      placeholder: When I press the hotkey while text is selected in Slack…
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: The selected text should have been replaced with the converted text.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open TextEdit
        2. Type "akuo guko"
        3. Select the text
        4. Press ⌘⌥V
      render: markdown
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: "14.4"
    validations:
      required: true

  - type: input
    id: swaype-version
    attributes:
      label: Swaype version
      description: Check **Settings → About** or the menu bar tooltip
      placeholder: "1.0.3"
    validations:
      required: true

  - type: input
    id: layout-pair
    attributes:
      label: Active layout pair
      description: What's shown next to "Pair:" in the menu bar dropdown
      placeholder: "U.S. ↔ Hebrew"
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Logs, screenshots, screen recordings — drop them here.
