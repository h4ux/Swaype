name: Feature request
description: Suggest an idea or improvement for Swaype
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation where Swaype falls short today.
      placeholder: I switch between three keyboards and want different hotkeys for each pair…
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: How would you like it to work?
      placeholder: A second hotkey in Settings bound to a second layout pair…
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Have you considered alternatives?
      placeholder: I tried changing the pair manually each time, but…

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
